<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Paper Summarizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis-network.min.css" />
    <style>
        #graph { width: 100%; height: 400px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>논문 요약</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="paper" accept="application/pdf" required />
        <button type="submit">업로드</button>
    </form>
    {% if summary %}
        <h2>요약 내용</h2>
        <p>{{ summary }}</p>
        <h3>Knowledge Graph</h3>
        <div id="graph"></div>
        <script>
            // 예시 데이터, 실제로는 서버에서 전달
            var nodes = new vis.DataSet([
                {id: 1, label: 'Paper'},
                {id: 2, label: 'Reference1'},
                {id: 3, label: 'Reference2'}
            ]);
            var edges = new vis.DataSet([
                {from: 1, to: 2},
                {from: 1, to: 3}
            ]);
            var container = document.getElementById('graph');
            var data = { nodes: nodes, edges: edges };
            var options = { interaction: { hover: true } };
            var network = new vis.Network(container, data, options);
            network.on('hoverNode', function(params) {
                var node = nodes.get(params.node);
                alert(node.label + '의 요약 내용');
            });
        </script>
    {% endif %}
</body>
</html>
